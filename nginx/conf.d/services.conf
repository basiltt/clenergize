# Clenergize V3 - Service Routing Configuration
# Routes external API requests (/api/v1/*) to internal services (/v1/*)

# Upstream Backend Services
upstream identity-service {
    server identity-service:3001;
    keepalive 32;
}

upstream organization-service {
    server organization-service:3002;
    keepalive 32;
}

upstream reference-service {
    server reference-service:3003;
    keepalive 32;
}

upstream activity-service {
    server activity-service:3004;
    keepalive 32;
}

upstream calculation-service {
    server calculation-service:3005;
    keepalive 32;
}

upstream reporting-service {
    server reporting-service:3006;
    keepalive 32;
}

upstream audit-service {
    server audit-service:3007;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# Main Server Block
server {
    listen 80;
    listen [::]:80;
    server_name localhost clenergize.local;

    # Correlation ID injection
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # CORS Headers (for development only)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Correlation-Id' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-Id';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ============================================
    # API Routes - External to Internal Mapping
    # External: /api/v1/* maps to Internal: /v1/*
    # ============================================

    # Identity Service
    location ~ ^/api/v1/(auth|users|roles|permissions|sessions) {
        limit_req zone=auth burst=20 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://identity-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Organization Service
    location ~ ^/api/v1/(organizations|projects|hierarchies|entities|subsidiaries|locations|scopes) {
        limit_req zone=api burst=50 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://organization-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Reference Service
    location ~ ^/api/v1/(factors|units|categories|sources|methodologies|conversions|reference-data) {
        limit_req zone=api burst=100 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://reference-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 5m;
    }

    # Activity Service
    location ~ ^/api/v1/(activities|activity-data|ingestion|imports|validations) {
        limit_req zone=api burst=50 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://activity-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # Calculation Service
    location ~ ^/api/v1/(calculations|emissions|aggregations|rollups|carbon-footprints) {
        limit_req zone=api burst=30 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://calculation-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # Reporting Service
    location ~ ^/api/v1/(reports|exports|analytics|dashboards|insights) {
        limit_req zone=api burst=20 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://reporting-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # Audit Service
    location ~ ^/api/v1/(audit-logs|audit|compliance|events) {
        limit_req zone=api burst=50 nodelay;

        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        proxy_pass http://audit-service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Frontend Application
    location / {
        proxy_pass http://frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block direct access to internal endpoints
    location ~ ^/v1/ {
        return 403 '{"error":"Direct access to internal endpoints forbidden"}';
        add_header Content-Type application/json;
    }
}
