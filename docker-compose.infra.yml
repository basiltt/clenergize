# docker-compose.infra.yml
# Infrastructure-only services for Clenergize V3
# Start with this before adding microservices

version: '3.8'

services:
  # ===========================================
  # MongoDB - Database
  # ===========================================
  mongodb:
    image: mongo:7.0
    container_name: clenergize-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: localdev123
    volumes:
      - mongodb-data:/data/db
    networks:
      - clenergize-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ===========================================
  # Redis - Cache and Pub/Sub
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: clenergize-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - clenergize-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # LocalStack - AWS Services Mock
  # ===========================================
  localstack:
    image: localstack/localstack:latest
    container_name: clenergize-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"  # Main endpoint
    environment:
      - SERVICES=secretsmanager,sqs,s3,cognito-idp,eventbridge,ses
      - DEFAULT_REGION=us-east-1
      - EDGE_PORT=4566
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - clenergize-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # MailHog - Email Testing
  # ===========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: clenergize-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - clenergize-network

  # ===========================================
  # Mongo Express - MongoDB Web UI
  # ===========================================
  mongo-express:
    image: mongo-express:latest
    container_name: clenergize-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=localdev123
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    networks:
      - clenergize-network
    depends_on:
      - mongodb

  # ===========================================
  # Redis Commander - Redis Web UI
  # ===========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: clenergize-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - clenergize-network
    depends_on:
      - redis

# ===========================================
# Volumes
# ===========================================
volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  localstack-data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  clenergize-network:
    driver: bridge