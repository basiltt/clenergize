# AlertManager Configuration for Clenergize V3

global:
  resolve_timeout: 5m
  # Slack webhook URL (replace with your actual webhook)
  slack_api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
  # SMTP settings for email notifications
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@clenergize.com'
  smtp_auth_username: 'alertmanager@clenergize.com'
  smtp_auth_password: 'YOUR_SMTP_PASSWORD'
  smtp_require_tls: true

# Templates for custom notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree for alerts
route:
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # How long to wait before sending initial notification
  group_wait: 10s

  # How long to wait before sending notification about new alerts in existing group
  group_interval: 10s

  # How long to wait before resending notification
  repeat_interval: 12h

  # Default receiver if no routes match
  receiver: 'default'

  # Child routes (evaluated in order)
  routes:
    # Critical alerts -> PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'pagerduty'
      continue: true  # Also send to next matching route

    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 5s
      repeat_interval: 4h

    # Warning alerts -> Slack + Email
    - match:
        severity: warning
      receiver: 'slack-warning'
      group_wait: 30s
      repeat_interval: 12h

    # Info alerts -> Email only
    - match:
        severity: info
      receiver: 'email'
      group_wait: 5m
      repeat_interval: 24h

    # Security alerts -> Immediate notification
    - match:
        category: security
      receiver: 'security-team'
      group_wait: 5s
      repeat_interval: 1h

    # Database alerts -> Database team
    - match:
        category: database
      receiver: 'database-team'
      group_wait: 30s

    # SLO violations -> Management
    - match:
        category: slo
      receiver: 'management'
      group_wait: 1m
      repeat_interval: 6h

# Inhibition rules (suppress alerts based on other alerts)
inhibit_rules:
  # If service is down, suppress all other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']

  # If critical error rate, suppress warning error rate
  - source_match:
      severity: 'critical'
      alertname: 'CriticalErrorRate'
    target_match:
      severity: 'warning'
      alertname: 'HighErrorRate'
    equal: ['service']

  # If critical response time, suppress warning response time
  - source_match:
      severity: 'critical'
      alertname: 'CriticalResponseTime'
    target_match:
      severity: 'warning'
      alertname: 'HighResponseTime'
    equal: ['service']

# Receivers (notification endpoints)
receivers:
  # Default receiver (email to ops team)
  - name: 'default'
    email_configs:
      - to: 'ops@clenergize.com'
        headers:
          Subject: '[Clenergize V3] Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Service:</strong> {{ .CommonLabels.service }}</p>
          <p><strong>Summary:</strong> {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}</p>
          <p><strong>Description:</strong> {{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>
          <p><strong>Runbook:</strong> <a href="{{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}">View Runbook</a></p>

  # PagerDuty for critical alerts
  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        description: '{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        details:
          firing: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
          resolved: 'Alert resolved'
          service: '{{ .CommonLabels.service }}'
          severity: '{{ .CommonLabels.severity }}'

  # Slack channel for critical alerts
  - name: 'slack-critical'
    slack_configs:
      - channel: '#clenergize-alerts-critical'
        username: 'AlertManager'
        icon_emoji: ':fire:'
        color: 'danger'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        title_link: '{{ range .Alerts }}{{ .GeneratorURL }}{{ end }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true

  # Slack channel for warning alerts
  - name: 'slack-warning'
    slack_configs:
      - channel: '#clenergize-alerts'
        username: 'AlertManager'
        icon_emoji: ':warning:'
        color: 'warning'
        title: 'Warning: {{ .GroupLabels.alertname }}'
        title_link: '{{ range .Alerts }}{{ .GeneratorURL }}{{ end }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          {{ end }}
        send_resolved: true

  # Email to general ops team
  - name: 'email'
    email_configs:
      - to: 'ops@clenergize.com'
        headers:
          Subject: '[Clenergize V3] {{ .GroupLabels.alertname }}'

  # Security team (critical security alerts)
  - name: 'security-team'
    email_configs:
      - to: 'security@clenergize.com'
        headers:
          Subject: '[SECURITY ALERT] {{ .GroupLabels.alertname }}'
          Priority: 'urgent'
    slack_configs:
      - channel: '#clenergize-security'
        username: 'SecurityAlert'
        icon_emoji: ':rotating_light:'
        color: 'danger'
        title: 'SECURITY: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *IMMEDIATE ACTION REQUIRED*
          {{ end }}

  # Database team
  - name: 'database-team'
    email_configs:
      - to: 'database@clenergize.com'
        headers:
          Subject: '[Database Alert] {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#clenergize-database'
        username: 'DBAlert'
        icon_emoji: ':floppy_disk:'
        title: 'Database: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Management (SLO violations)
  - name: 'management'
    email_configs:
      - to: 'management@clenergize.com,ops@clenergize.com'
        headers:
          Subject: '[SLO Violation] {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#clenergize-slo'
        username: 'SLOMonitor'
        icon_emoji: ':chart_with_downwards_trend:'
        color: 'danger'
        title: 'SLO Violation: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *This may impact customer SLA commitments*
          {{ end }}

# Time intervals for muting alerts (optional)
time_intervals:
  - name: 'business-hours'
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '09:00'
            end_time: '17:00'
        location: 'UTC'

  - name: 'off-hours'
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '17:00'
            end_time: '09:00'
      - weekdays: ['saturday', 'sunday']
